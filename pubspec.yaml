name: reveduc_login
description: "RevEduc login screen UI for TUPC Department of Industrial Education."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_database: ^12.4.6
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  file_picker: 10.3.10
  csv: ^8.0.0
  docx_to_text: ^1.0.1
  syncfusion_flutter_pdf: ^33.2.13
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^1.0.8
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
